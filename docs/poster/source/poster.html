<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    position: relative;
    overflow: hidden;
    background: #06070c;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans GB", "PingFang SC", sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- background ---------- */
  .bg-base {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 520px at 82% 18%, rgba(124,92,255,.30), transparent 62%),
      radial-gradient(760px 460px at 100% 96%, rgba(0,196,255,.20), transparent 60%),
      radial-gradient(700px 460px at 12% -12%, rgba(255,64,160,.14), transparent 60%),
      radial-gradient(520px 380px at 2% 108%, rgba(255,60,150,.085), transparent 68%),
      linear-gradient(160deg, #0c0f1b 0%, #06070c 52%, #04050a 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(760px 520px at 30% 40%, #000 10%, transparent 78%);
    opacity: .55;
  }
  .beam {
    position: absolute; inset: -10% -10% -10% -10%;
    background: linear-gradient(118deg, transparent 30%, rgba(255,255,255,.055) 46%, rgba(190,210,255,.10) 50%, transparent 62%);
    mix-blend-mode: screen;
  }
  .noise {
    position: absolute; inset: 0; opacity: .05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(120% 100% at 50% 50%, transparent 45%, rgba(0,0,0,.55) 100%);
  }

  /* rainbow edge accents */
  .edge-top, .edge-bottom { position: absolute; left: 0; right: 0; height: 3px; }
  .edge-top {
    top: 0;
    background: linear-gradient(90deg, #ff2d55, #ff7a18, #ffc531, #2ed47a, #12c2d8, #2f7bff, #9b5cff, #ff2d55);
    opacity: .9;
  }
  .edge-bottom {
    bottom: 0;
    background: linear-gradient(90deg, #9b5cff, #2f7bff, #12c2d8, #2ed47a, #ffc531, #ff7a18, #ff2d55);
    opacity: .55;
  }

  /* ---------- layout ---------- */
  .stage {
    position: absolute; inset: 0;
    padding: 66px 76px 0 84px;
    display: flex; align-items: center; gap: 24px;
  }
  .copy { width: 660px; flex: none; }

  .eyebrow { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .tag {
    font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: #c9d0ea; padding: 7px 13px 6px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.05);
    border-radius: 999px;
  }
  .tag.ghost { color: #8b93b0; border-color: rgba(255,255,255,.10); background: transparent; letter-spacing: .12em; }
  .dot-rainbow {
    width: 9px; height: 9px; border-radius: 50%;
    background: conic-gradient(from 210deg, #ff2d55, #ff7a18, #ffc531, #2ed47a, #12c2d8, #2f7bff, #9b5cff, #ff2d55);
    box-shadow: 0 0 14px rgba(180,140,255,.9);
  }

  h1 {
    font-size: 100px; font-weight: 700; letter-spacing: -3.2px; line-height: 1;
    margin-bottom: 20px; display: flex; align-items: baseline;
  }
  h1 .w1 {
    background: linear-gradient(178deg, #ffffff 10%, #ffffff 46%, #c3cce8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 .w2 {
    margin-left: 2px;
    background: linear-gradient(100deg, #ff5f8f 0%, #c37cff 26%, #8b7bff 48%, #4fa8ff 72%, #3ad6e6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(150,110,255,.35));
  }
  .rule {
    width: 92px; height: 5px; border-radius: 99px; margin-bottom: 24px;
    background: linear-gradient(90deg, #ff2d55, #ff7a18, #ffc531, #2ed47a, #12c2d8, #2f7bff, #9b5cff);
    box-shadow: 0 0 22px rgba(120,140,255,.55);
  }
  .cn {
    font-size: 36px; font-weight: 600; letter-spacing: .6px; color: #eef1fb;
    line-height: 1.36; margin-bottom: 18px;
  }
  .cn em { font-style: normal; color: #9fb0ff; }
  .desc {
    font-size: 19.5px; line-height: 1.72; color: #98a1bd; letter-spacing: .2px; margin-bottom: 30px;
  }
  .desc b { color: #cfd6ee; font-weight: 600; }

  .chips { display: flex; gap: 10px; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    font-size: 15.5px; color: #d5dbf1; font-weight: 500; letter-spacing: .2px;
    padding: 10px 16px 10px 13px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.11);
  }
  .chip i {
    width: 6px; height: 6px; border-radius: 50%; display: block;
    background: var(--c); box-shadow: 0 0 10px var(--c);
  }

  /* ---------- right: logo ---------- */
  .hero {
    position: relative; flex: 1;
    height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .halo {
    position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background:
      radial-gradient(closest-side, rgba(150,100,255,.55), transparent 72%) 62% 22% / 62% 62% no-repeat,
      radial-gradient(closest-side, rgba(0,190,255,.40), transparent 72%) 78% 78% / 60% 60% no-repeat,
      radial-gradient(closest-side, rgba(255,60,140,.32), transparent 72%) 26% 70% / 58% 58% no-repeat;
    filter: blur(46px); opacity: .95;
  }
  .ring {
    position: absolute; width: 396px; height: 396px; border-radius: 50%;
    background: conic-gradient(from 140deg, #ff2d55, #ff7a18, #ffc531, #2ed47a, #12c2d8, #2f7bff, #9b5cff, #ff2d55);
    -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2px), #000 calc(100% - 1.4px));
    mask: radial-gradient(closest-side, transparent calc(100% - 2px), #000 calc(100% - 1.4px));
    opacity: .55; filter: blur(.4px);
  }
  .halo-2 {
    position: absolute; width: 420px; height: 420px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.10);
  }
  .halo-3 {
    position: absolute; width: 520px; height: 520px; border-radius: 50%;
    border: 1px dashed rgba(255,255,255,.045);
  }
  .logo-card {
    position: relative;
    width: 312px; height: 312px; border-radius: 80px;
    background: linear-gradient(155deg, #ffffff 0%, #f4f6ff 58%, #e6ebff 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.55) inset,
      0 34px 70px -18px rgba(0,0,0,.75),
      0 0 90px -10px rgba(140,120,255,.55);
  }
  .logo-card img { width: 254px; height: 254px; display: block; }
  .glare {
    position: absolute; inset: 0; border-radius: 80px; pointer-events: none;
    background: linear-gradient(150deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 42%);
    opacity: .55;
  }

  /* ---------- footer ---------- */
  .foot {
    position: absolute; left: 84px; right: 76px; bottom: 30px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13.5px; letter-spacing: .06em; color: #7c86a4;
  }
  .foot .repo { color: #b6bed6; font-weight: 500; }
  .foot .sep { opacity: .4; margin: 0 10px; }
</style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="grid"></div>
  <div class="vignette"></div>
  <div class="beam"></div>
  <div class="noise"></div>
  <div class="edge-top"></div>
  <div class="edge-bottom"></div>

  <div class="stage">
    <div class="copy">
      <div class="eyebrow">
        <span class="tag"><span class="dot-rainbow"></span>DeepSeek Harness 插件</span>
        <span class="tag ghost">MIT</span>
      </div>
      <h1><span class="w1">deep</span><span class="w2">Image</span></h1>
      <div class="rule"></div>
      <div class="cn">在对话里，说一句就出图。</div>
      <p class="desc">
        为 DeepSeek Harness 接入<b>图像与视频生成</b>能力，服务商可自由配置。
      </p>
      <div class="chips">
        <span class="chip" style="--c:#12c2d8"><i></i>一句话绘图</span>
        <span class="chip" style="--c:#2ed47a"><i></i>异步视频任务</span>
        <span class="chip" style="--c:#9b5cff"><i></i>自定义服务商</span>
      </div>
    </div>

    <div class="hero">
      <div class="halo"></div>
      <div class="ring"></div>
      <div class="halo-3"></div>
      <div class="halo-2"></div>
      <div class="logo-card">
        <img src="logo.png" alt="deepImage">
        <div class="glare"></div>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="repo">github.com/chinahu-woker/deepimage</span>
    <span>
      <span>DSH ≥ 0.2.1</span>
    </span>
  </div>
</body>
</html>
