name: Build and publish plugin package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check release version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) { console.error("Tag must match package.json version"); process.exit(1) }'
      - name: Package plugin
        run: |
          mkdir -p dist
          npm run pack:plugin
      - name: Create release with package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
