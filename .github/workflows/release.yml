name: Build and publish open-source plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check release version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) { console.error("Open-source tag must match v<package.json version>"); process.exit(1) }'
      - name: Package plugin
        run: |
          mkdir -p dist
          npm run pack:plugin
          version=$(node -p 'require("./package.json").version')
          mv "dist/dsh-media-generation-${version}.tgz" "dist/deepimage-open-source-${version}.tgz"
      - name: Create release with package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/deepimage-open-source-*.tgz downloads/deepImage-installer-macOS.zip downloads/deepImage-installer-Windows.zip --title "deepImage 开源版 $GITHUB_REF_NAME" --verify-tag --notes-file .github/release-notes-oss.md
