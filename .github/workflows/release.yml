name: Build and publish New API plugin

on:
  push:
    tags:
      - 'newapi-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check release version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "newapi-v" + require("./package.json").version) { console.error("New API tag must match newapi-v<package.json version>"); process.exit(1) }'
      - name: Package plugin
        run: |
          mkdir -p dist
          npm run pack:plugin
          version=$(node -p 'require("./package.json").version')
          mv "dist/dsh-media-generation-${version}.tgz" "dist/deepimage-newapi-${version}.tgz"
      - name: Include desktop installers
        run: cp downloads/deepImage-installer-macOS.zip downloads/deepImage-installer-Windows.zip dist/
      - name: Create release with package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/deepimage-newapi-*.tgz dist/deepImage-installer-macOS.zip dist/deepImage-installer-Windows.zip --title "deepImage 桌面安装器 $GITHUB_REF_NAME" --latest=false --verify-tag --notes-file .github/release-notes-newapi.md
